services:
  # 1. ESCUDO PERIMETRAL (WAF)
  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: shamir-waf
    environment:
      # Le indicamos al WAF a quién debe proteger
      - BACKEND=http://frontend:80
    ports:
      - "5173:8080" # El WAF es ahora el único que da la cara al mundo
    networks:
      - public_net
    restart: unless-stopped
    depends_on:
      - frontend

  # 2. CAPA DE PRESENTACIÓN (Oculta detrás del WAF)
  frontend:
    build: 
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_KEY=${PUBLIC_API_KEY}
    container_name: shamir-frontend
    # NOTA: Borramos el "ports: 5173:80". El frontend ya no tiene salida directa.
    networks:
      - public_net
    restart: unless-stopped
    depends_on:
      - gateway

  # 3. CAPA DE INTERMEDIACIÓN (El Puente / DMZ)
  gateway:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: shamir-gateway
    env_file:
      - .env
    networks:
      - public_net
      - private_net
    restart: unless-stopped

  # 4. CAPA DE ALMACENAMIENTO (Aislada y ciega)
  node-1:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: shamir-node-1
    command: uvicorn src.adapters.vault:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - ./bovedas_locales/nodo-1:/app/data
    networks:
      - private_net
    restart: unless-stopped

  node-2:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: shamir-node-2
    command: uvicorn src.adapters.vault:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - ./bovedas_locales/nodo-2:/app/data
    networks:
      - private_net
    restart: unless-stopped

  node-3:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: shamir-node-3
    command: uvicorn src.adapters.vault:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - ./bovedas_locales/nodo-3:/app/data
    networks:
      - private_net
    restart: unless-stopped

  node-4:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: shamir-node-4
    command: uvicorn src.adapters.vault:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - ./bovedas_locales/nodo-4:/app/data
    networks:
      - private_net
    restart: unless-stopped

  node-5:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: shamir-node-5
    command: uvicorn src.adapters.vault:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - ./bovedas_locales/nodo-5:/app/data
    networks:
      - private_net
    restart: unless-stopped

  # --- MOVER KEYCLOAK ACÁ, ADENTRO DE SERVICES ---
  postgres_keycloak:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: super_secret_password
    volumes:
      - ./keycloak_data:/var/lib/postgresql/data
    networks:
      - public_net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: super_secret_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres_keycloak
    networks:
      - public_net
    restart: unless-stopped

# DEFINICIÓN DE LA MICROSEGMENTACIÓN ZERO TRUST
networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge
    internal: true